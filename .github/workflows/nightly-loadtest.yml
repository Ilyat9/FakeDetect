name: Nightly load test

# A-C4: regular (not per-PR) performance check so regressions show up on a
# schedule instead of post-hoc on prod. Runs against PROVIDER=mock — no real
# LLM calls, no cost — so this can run unattended on a schedule.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r loadtests/requirements-loadtest.txt

      - name: Start app (mock provider, no LLM cost)
        env:
          DB_PATH: /tmp/ci_loadtest.db
          PROVIDER: mock
          LOG_FORMAT: json
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Run Locust (headless, 20 users, 60s)
        run: >
          locust -f loadtests/locustfile.py --host http://127.0.0.1:8000
          --headless -u 20 -r 5 --run-time 60s
          --csv=loadtest-results --only-summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: |
            loadtest-results*.csv
            server.log
