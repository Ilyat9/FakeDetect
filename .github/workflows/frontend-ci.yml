name: Frontend CI

on:
  push:
    branches: [main, master]
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Lint (incl. FSD layer boundaries)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit + component tests (Vitest + RTL + MSW)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Storybook build (design system compiles)
        run: npm run build-storybook

      # Spec 3.1, real check: boot the FastAPI backend, regenerate types from
      # its live OpenAPI schema and fail when they differ from the committed
      # file — the frontend can never silently drift from the API contract.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: API types freshness check (against live backend)
        run: |
          python -m pip install --quiet -r ../requirements.txt
          (cd .. && DB_PATH=/tmp/ci_fakedetect.db nohup python -m uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/openapi.json > /dev/null
          npm run check:api-types

      # Spec 7.5: Lighthouse CI with Core Web Vitals thresholds
      # (lighthouserc.json: perf >= 0.8, a11y >= 0.9, LCP <= 2.5s, CLS <= 0.1).
      - name: Lighthouse CI
        run: npm run lhci

      # Spec 7.4: bundle size budget — main chunk must stay under 300 kB gzipped.
      - name: Bundle size budget
        run: |
          LIMIT_KB=300
          MAIN_GZ=$(gzip -c dist/assets/index-*.js | wc -c | awk '{print int($1/1024)}')
          echo "Main chunk gzipped: ${MAIN_GZ} kB (limit ${LIMIT_KB} kB)"
          if [ "$MAIN_GZ" -gt "$LIMIT_KB" ]; then
            echo "::error::Main JS chunk exceeds budget"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: npx playwright test
