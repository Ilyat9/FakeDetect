server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (spec 9.3) ---------------------------------------
    # CSP: scripts/styles/fonts self-hosted only (no external origins at all).
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self';
        font-src 'self';
        img-src 'self' data: blob:;
        connect-src 'self';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self'
    " always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API reverse proxy: same origin => no CORS anywhere -----------------
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 20m;
        # Long-running analyses / deep mode.
        proxy_read_timeout 300s;
    }

    # --- Static assets -------------------------------------------------------
    # Hashed filenames => immutable caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts: stable filenames, safe to cache long.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached so deploys roll out instantly.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history-API fallback for TanStack Router deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
